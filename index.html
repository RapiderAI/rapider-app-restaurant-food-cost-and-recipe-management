<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Restaurant Food Cost &amp; Recipe Management</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "recipes": "pages/recipes/recipes.html",
  "ingredients": "pages/ingredients/ingredients.html",
  "vendor-prices": "pages/vendor-prices/vendor-prices.html",
  "par-orders": "pages/par-orders/par-orders.html",
  "count-sheets": "pages/count-sheets/count-sheets.html",
  "tva-variance": "pages/tva-variance/tva-variance.html",
  "menu-engineering": "pages/menu-engineering/menu-engineering.html",
  "cogs-gl-close": "pages/cogs-gl-close/cogs-gl-close.html",
  "recipe-detail": "pages/recipe-detail/recipe-detail.html",
  "count-sheet-detail": "pages/count-sheet-detail/count-sheet-detail.html",
  "recipe-component-drawer": "pages/recipe-component-drawer/recipe-component-drawer.html",
  "invoice-line-drawer": "pages/invoice-line-drawer/invoice-line-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
